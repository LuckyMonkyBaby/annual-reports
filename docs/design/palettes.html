<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Annual reports — palette studies</title><style>
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px Arial,Helvetica,sans-serif;transition:background .25s,color .25s}main{max-width:1400px;margin:auto;padding:30px 40px}nav{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:55px}button{font:inherit;color:inherit;background:none;border:1px solid currentColor;border-radius:0;padding:10px 14px;cursor:pointer}button[aria-pressed=true]{background:var(--ink);color:var(--paper)}button:focus-visible{outline:3px solid currentColor;outline-offset:4px}.brand{font-size:clamp(45px,10vw,145px);letter-spacing:-.06em;line-height:1;margin:0 0 18px}p{margin:0 0 30px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:30px}.cover{margin:0;min-width:0}.cover img{display:block;width:100%;height:430px;object-fit:contain;object-position:bottom}.cover figcaption{display:flex;justify-content:space-between;gap:10px;margin-top:12px;font-size:12px}.swatches{display:flex;gap:25px;flex-wrap:wrap;margin:38px 0 18px;font-size:16px}.foot{font-size:clamp(45px,15vw,190px);letter-spacing:-.06em;margin-top:65px;white-space:nowrap;line-height:1}@media(max-width:760px){main{padding:24px 20px}nav{margin-bottom:35px}.grid{grid-template-columns:1fr 1fr;gap:20px}.cover:first-child{grid-column:1/-1}.cover img{height:250px}.cover:first-child img{height:450px}.foot{font-size:15vw}}
</style><main><nav id="choices" aria-label="Palette choices"></nav><h1 class="brand">Annual reports</h1><p id="note"></p><div class="grid"><figure class="cover"><img src="https://annual-reports-chi.vercel.app/covers/886982-0001193125-25-054427-crop.webp" alt="GOLDMAN SACHS GROUP INC 2024 report cover"><figcaption><span>Goldman Sachs Group Inc</span><span>2024</span></figcaption></figure><figure class="cover"><img src="https://annual-reports-chi.vercel.app/covers/1048911-0001104659-26-097845.webp" alt="FEDEX CORP 2026 report cover"><figcaption><span>Fedex Corp</span><span>2026</span></figcaption></figure><figure class="cover"><img src="https://annual-reports-chi.vercel.app/covers/866374-0001308179-26-000368.webp" alt="FLEX LTD. 2026 report cover"><figcaption><span>Flex Ltd.</span><span>2026</span></figcaption></figure></div><div class="swatches" id="swatches"></div><button id="reverse">Reverse colors</button><div class="foot">Annual reports</div></main><script>
const palettes=[["Acid / Plum", "#e1f57b", "#39233d", "Saved original theme"], ["Blush / Oxblood", "#f5c6cf", "#6d2035", "Warm and editorial"], ["Apricot / Ultramarine", "#ffd6ad", "#2539cf", "Bright and graphic"], ["Lilac / Forest", "#e5d5f1", "#174b3b", "Rich and composed"], ["Mandarin / Aubergine", "#ff9a52", "#48213e", "Warm, confident and expressive"], ["Ice / Rust", "#bce9f4", "#8b2f1b", "Cool paper with a warm printed accent"], ["Mint / Ink", "#afebcf", "#182f61", "Fresh and precise"], ["Periwinkle / Espresso", "#c6ccff", "#49302b", "Soft, unusual and editorial"], ["Butter / Vermilion", "#f4e18c", "#9a241c", "Selected current theme · vintage print feeling"], ["Orchid / Midnight", "#ef94d1", "#102a43", "Vivid and contemporary"]];let selected=8,reversed=false;
function render(){const [name,paper,ink,note]=palettes[selected],colors=reversed?[ink,paper]:[paper,ink];document.body.style.setProperty('--paper',colors[0]);document.body.style.setProperty('--ink',colors[1]);document.getElementById('note').textContent=name+' · '+note+' · palette study with real report covers';document.getElementById('swatches').textContent=paper+' / '+ink;document.querySelectorAll('#choices button').forEach((b,i)=>b.setAttribute('aria-pressed',i===selected));}
palettes.forEach(([name],i)=>{const b=document.createElement('button');b.textContent=name;b.onclick=()=>{selected=i;render()};document.getElementById('choices').append(b)});document.getElementById('reverse').onclick=()=>{reversed=!reversed;render()};render();
</script></html>
